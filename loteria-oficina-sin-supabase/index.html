<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#004250">
  <title>El número de la oficina · IMPULSA IGUALDAD</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#003e4b;background:#f0f5f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#d9e50666,transparent 32%),#f0f5f0}.wrap{max-width:810px;margin:auto;padding:25px 16px 50px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:26px;font-size:13px;font-weight:900;letter-spacing:.08em}.pill{font-size:12px;background:#004250;color:white;padding:8px 11px;border-radius:30px}.card{background:white;border:1px solid #dce7df;border-radius:25px;box-shadow:0 17px 45px #00425018;padding:clamp(23px,6vw,52px)}.kicker{color:#cc4930;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.13em;margin:0 0 12px}h1{font-size:clamp(35px,7vw,65px);line-height:1.05;letter-spacing:-.055em;margin:0 0 20px}h2{font-size:clamp(27px,5vw,40px);line-height:1.13;letter-spacing:-.035em;margin:0 0 14px}p{font-size:17px;line-height:1.55;margin:0 0 20px}.soft{color:#536d70}.rule{background:#edf4ed;padding:18px 20px;border-radius:14px;line-height:1.5;margin:24px 0}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;font:inherit;font-weight:850;min-height:51px;cursor:pointer}.primary{background:#d9e506;color:#123e3c}.secondary{background:white;color:#004250;border:1px solid #b9ceca}.primary:focus-visible,.secondary:focus-visible,.option:focus-visible{outline:3px solid #ff5c3e;outline-offset:3px}.options{display:grid;gap:10px;margin:25px 0}.option{border:2px solid #d5e3db;border-radius:13px;background:white;min-height:76px;width:100%;display:flex;gap:15px;align-items:center;text-align:left;padding:13px 17px;color:#003e4b;font:inherit;cursor:pointer}.option:hover,.option.selected{border-color:#004250;background:#f6f9ec}.option strong{font-size:17px}.digit{width:45px;height:45px;flex:none;background:#d9e506;border-radius:10px;display:grid;place-items:center;font-size:27px;font-weight:900}.number{display:flex;gap:9px;flex-wrap:wrap;margin:23px 0}.number span{border:2px solid #d5e3db;background:#f7faf5;width:clamp(43px,12vw,68px);height:clamp(57px,15vw,82px);display:grid;place-items:center;border-radius:11px;font-size:clamp(28px,8vw,49px);font-weight:900;font-variant-numeric:tabular-nums}.number.revealed span{background:#004250;color:#d9e506;border-color:#004250}.meter{height:8px;background:#e6eee8;border-radius:10px;margin:0 0 27px;overflow:hidden}.meter span{display:block;background:#ff5c3e;height:100%}.count{font-size:clamp(40px,9vw,65px);font-weight:900;letter-spacing:-.05em;margin:8px 0}.alternate{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #d6e4dc;border-radius:12px;padding:11px 14px;margin:9px 0}.alternate b{letter-spacing:.13em;font-size:23px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.note{font-size:13px;color:#537076;margin-top:25px}.error{color:#a33122;font-weight:750}.spinner{font-weight:800;color:#004250}.notice{font-size:14px;background:#f1f5eb;padding:13px;border-radius:10px}@media(max-width:480px){header{font-size:10px}.pill{font-size:10px}.card{padding:26px 20px}.alternate b{font-size:19px}}
  </style>
</head>
<body><div class="wrap"><header><span>IMPULSA IGUALDAD</span><span class="pill" id="mode">MODO DE PRUEBA</span></header><main class="card" id="app" aria-live="polite"></main><p class="note" id="foot"></p></div>
<script>
  const CONFIG={minParticipants:6};
  const QUESTIONS=[
    {title:'¿Qué debería venir de serie con el lunes?',sub:'Se admiten soluciones poco realistas.',options:[['2','Que empiece el martes'],['5','Café intravenoso (metafórico)'],['8','Una tecla para deshacer reuniones']]},
    {title:'¿Qué superpoder pedirías para la oficina?',sub:'La capa es opcional. La respuesta, confidencial.',options:[['1','Más teletrabajo'],['4','Reuniones que terminan antes de tiempo'],['7','Encontrar la versión «definitiva_final_ahora_sí»']]},
    {title:'¿Qué frase debería estar en una taza?',sub:'Porque un correo no siempre basta.',options:[['0','«Te lo envío en un momento»'],['3','«¿Se me ve? ¿Se me oye?»'],['9','«Este Excel antes funcionaba»']]},
    {title:'Si la oficina fuera una serie, ¿cuál sería?',sub:'Basada en hechos demasiado reales.',options:[['2','Misión: llegar al viernes'],['6','El misterio del cargador desaparecido'],['8','La última versión del documento']]},
    {title:'¿Cómo celebramos encontrar el número?',sub:'Última decisión. Que la fortuna nos pille riéndonos.',options:[['1','Con un brindis improvisado'],['5','Pidiendo teletrabajo también para enero'],['7','Comprobando si el número existe']]}
  ];
  const app=document.getElementById('app');
  document.getElementById('mode').textContent='PANTALLA COMPARTIDA';
  document.getElementById('foot').textContent='Las papeletas se guardan en este navegador. Cada persona responde por turnos en este mismo dispositivo.';
  const DEMO_KEY='cinco_decisiones_oficina_v1';
  let step=-1,picks=[],busy=false;
  const btn=(txt,action,secondary=false)=>'<button type="button" class="'+(secondary?'secondary':'primary')+'" data-action="'+action+'">'+txt+'</button>';
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function ballots(){try{return JSON.parse(localStorage.getItem(DEMO_KEY)||'[]')}catch{return []}}
  function numbers(votes){
    const ranks=QUESTIONS.map((q,i)=>q.options.map((o,j)=>({digit:o[0],count:votes.filter(v=>v[i]===j).length,j})).sort((a,b)=>b.count-a.count||a.j-b.j));
    const number=ranks.map(r=>r[0].digit).join('');
    const alternatives=ranks.map((r,i)=>({value:ranks.map((c,k)=>k===i?r[1].digit:c[0].digit).join(''),score:r[1].count-r[0].count})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.value);
    return {number,alternatives};
  }
  async function status(){const votes=ballots();return {count:votes.length,threshold:CONFIG.minParticipants,revealed:votes.length>=CONFIG.minParticipants,...(votes.length>=CONFIG.minParticipants?numbers(votes):{})};}
  function progress(){return '<div class="meter" aria-hidden="true"><span style="width:'+Math.max(0,step)/QUESTIONS.length*100+'%"></span></div>'}
  async function home(){step=-1;picks=[];app.innerHTML='<p class="kicker">El número de la oficina</p><h1>Cinco decisiones.<br>Una fortuna compartida.</h1><p>Responde cinco preguntas. Tu voto aportará una cifra a cada posición del número de lotería.</p><div class="rule"><strong>La intriga tiene fecha de caducidad:</strong> las primeras '+CONFIG.minParticipants+' papeletas completas eligen el número. Al llegar a ese mínimo, se revela y se cierra la votación.</div><div id="state" class="notice">Consultando participaciones…</div><div class="actions">'+btn('Jugar','start')+'</div>';await updateHome();}
  async function updateHome(){try{const s=await status();const stateEl=document.getElementById('state');if(!stateEl)return;stateEl.textContent=s.revealed?'¡Ya hay número! '+s.count+' participaciones registradas.':s.count+' de '+s.threshold+' participaciones completas para revelar el número.';if(s.revealed)app.querySelector('.actions').innerHTML=btn('Ver el número','result')+btn('Reiniciar votación','reset',true);}catch(e){const stateEl=document.getElementById('state');if(stateEl)stateEl.textContent=e.message}}
  function renderQuestion(){const q=QUESTIONS[step];app.innerHTML='<p class="kicker">Decisión '+(step+1)+' de 5</p>'+progress()+'<h2>'+esc(q.title)+'</h2><p class="soft">'+esc(q.sub)+'</p><div class="options">'+q.options.map((o,i)=>'<button type="button" class="option '+(picks[step]===i?'selected':'')+'" aria-pressed="'+(picks[step]===i)+'" data-pick="'+i+'"><span class="digit">'+o[0]+'</span><strong>'+esc(o[1])+'</strong></button>').join('')+'</div><p class="note">Cada respuesta corresponde a una cifra. Verás el número cuando se complete la participación mínima.</p>'+btn(step===4?'Enviar mi papeleta':'Siguiente pregunta','next')+'<p id="error" class="error" role="alert"></p>'}
  function next(){if(picks[step]===undefined){document.getElementById('error').textContent='Elige una respuesta antes de seguir.';return}if(step<4){step++;renderQuestion()}else submit()}
  async function submit(){if(busy)return;busy=true;app.querySelector('[data-action="next"]').disabled=true;try{const all=ballots();if(all.length>=CONFIG.minParticipants){await result();busy=false;return}all.push([...picks]);localStorage.setItem(DEMO_KEY,JSON.stringify(all));await result();busy=false}catch(e){busy=false;document.getElementById('error').textContent=e.message;app.querySelector('[data-action="next"]').disabled=false}}
  async function result(){app.innerHTML='<p class="spinner">Consultando el resultado…</p>';try{const s=await status();if(!s.revealed){app.innerHTML='<p class="kicker">Papeleta recibida</p><h2>El número está en modo incógnito.</h2><div class="count">'+s.count+' / '+s.threshold+'</div><p>Faltan '+(s.threshold-s.count)+' participaciones para que aparezca. Pasa el dispositivo a la siguiente persona para seguir.</p><div class="actions">'+btn('Siguiente persona','another')+'</div>';return}app.innerHTML='<p class="kicker">El número de la oficina</p><h1>Que nos pille con décimo.</h1><p>'+s.count+' personas han terminado el juego. Este es el número elegido:</p><div class="number revealed" aria-label="Número '+s.number+'">'+[...s.number].map(c=>'<span>'+c+'</span>').join('')+'</div><div class="actions">'+btn('Copiar el número','copy:'+s.number)+'</div><h2 style="font-size:27px;margin-top:38px">Por si la suerte llegó antes que nosotros</h2><p class="soft">Tres alternativas para consultar si el principal ya no está disponible.</p>'+s.alternatives.map((n,i)=>'<div class="alternate"><div><small>Alternativa '+(i+1)+'</small><br><b>'+n+'</b></div>'+btn('Copiar','copy:'+n,true)+'</div>').join('')+'<p class="note">La disponibilidad se consulta en vuestra aplicación de lotería.</p>'+btn('Reiniciar votación','reset',true)}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p>'+btn('Reintentar','result')}}
  function another(){busy=false;step=0;picks=[];renderQuestion()}
  function reset(){if(window.confirm('¿Borrar las papeletas y empezar de nuevo? Esta acción no se puede deshacer.')){localStorage.removeItem(DEMO_KEY);home()}}
  document.addEventListener('click',async e=>{const p=e.target.closest('[data-pick]');if(p){picks[step]=Number(p.dataset.pick);renderQuestion();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start'||a==='another')another();else if(a==='next')next();else if(a==='result')result();else if(a==='reset')reset();else if(a.startsWith('copy:')){const n=a.slice(5);try{await navigator.clipboard.writeText(n);b.textContent='Copiado'}catch{window.prompt('Copia el número:',n)}}});
  home();
</script></body></html>
